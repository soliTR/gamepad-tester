name: Feature request
description: Suggest a new test or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [open issues and milestones](https://github.com/soliTR/gamepad-tester/milestones) first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to test or do?
      description: Describe the problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
  - type: input
    id: controller
    attributes:
      label: Controller it is about (if any)

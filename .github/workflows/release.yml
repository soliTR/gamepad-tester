# Builds the portable release archives when a version tag (v1.2.3) is pushed,
# publishes SHA-256 checksums and a signed build provenance attestation, and
# creates the GitHub release.
#
# Actions are pinned to full commit SHAs; Dependabot keeps them up to date.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 keeps the glibc requirement low (2.35), so the binary runs on most distributions
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the project version
        run: |
          project_version=$(sed -n 's/^project(gamepad-tester VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$project_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $project_version in CMakeLists.txt"
            exit 1
          fi

      - name: Install build dependencies
        run: CI=true scripts/install-deps.sh --bundled-sdl

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMEPAD_TESTER_BUNDLED_SDL=ON -DGAMEPAD_TESTER_WERROR=ON
          cmake --build build

      - name: Smoke test
        run: scripts/smoke-test.sh build/gamepad-tester

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}" build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Write release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          # the section of this version from CHANGELOG.md
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-verification.md >> notes.md
          sed -i "s/@VERSION@/$version/g" notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Gamepad-Tester ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag

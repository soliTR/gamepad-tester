# Builds and smoke-tests every push and pull request on the supported distributions,
# using scripts/install-deps.sh exactly as described in the README.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - archlinux:latest
          - fedora:latest
          - opensuse/tumbleweed:latest
          - ubuntu:26.04   # packaged SDL3 3.4
          - debian:13      # SDL3 too old: built from source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: CI=true scripts/install-deps.sh | tee deps.log

      - name: Build
        run: |
          build_command=$(grep -A1 "Build with:" deps.log | tail -n 1)
          $build_command -DGAMEPAD_TESTER_WERROR=ON
          cmake --build build

      - name: Smoke test
        run: scripts/smoke-test.sh build/gamepad-tester

  portable:
    name: Portable build (as released)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: CI=true scripts/install-deps.sh --bundled-sdl

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMEPAD_TESTER_BUNDLED_SDL=ON -DGAMEPAD_TESTER_WERROR=ON
          cmake --build build

      - name: Smoke test
        run: scripts/smoke-test.sh build/gamepad-tester build/screenshots

      - name: Package
        run: scripts/package.sh "dev-${GITHUB_SHA::7}" x86_64 build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-and-screenshots
          path: |
            dist/*.tar.gz
            build/screenshots/*.bmp
          retention-days: 14
